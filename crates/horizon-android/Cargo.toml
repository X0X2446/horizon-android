[package]
name = "horizon-android"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
description = "Horizon's Android port: the platform glue, touch controls and the compatibility settings of the ZalithLauncher family"
publish = false

# The port builds on its own: the game's dependency tree is enormous (wgpu, tokio,
# ...) and only the Android target needs it. Host builds compile the pure logic
# (settings, touch controller, paths, JSON) with no dependencies at all.
[workspace]

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Marker for the wrapper crate (Gradle build): the game is linked in and the
# wrapper provides `android_main`. The port crate itself never needs it.
game = []

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", default-features = false, features = ["native-activity"] }
jni = "0.21"
log = "0.4"

# Host-build verification only: the stubs let the pure logic compile and test
# without crates.io. The real Android build (Gradle) uses the real crates from
# crates.io — the Gradle build provides its own Cargo config that drops this patch.
[patch.crates-io]
android-activity = { path = "stubs/android-activity" }
jni = { path = "stubs/jni" }
log = { path = "stubs/log" }

[lints]
workspace = true
